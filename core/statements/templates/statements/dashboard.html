<!DOCTYPE html>
<html lang="en">
  <head>
  	<title>Statement Generator</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    {% load static %}
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet">
		<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
		<link rel="stylesheet" href="{% static 'statements/styler.css' %}">
    <link rel="stylesheet" href="{% static 'statements/style.css' %}">
  </head>
  <body>
		
		<div class="wrapper d-flex align-items-stretch">
			<nav id="sidebar">
        <div class="navbar-brand d-flex align-items-center">
          <!-- Full logo (expanded sidebar) -->
          <img src="{% static '/statements/logo-eng.png' %}" class="nav-logo logo-full" alt="Logo">
          <!-- Icon logo (collapsed sidebar) -->
          <img src="{% static '/statements/logo-alt.png' %}" class="nav-logo logo-icon" alt="Logo Icon">
        </div>
        <ul class="list-unstyled components mb-5">
          <li class="active">
            <a href="#"><span class="fa fa-home"></span> Home</a>
          </li>
          <li>
              <a href="#"><span class="fa fa-user"></span> About</a>
          </li>
          <li>
            <!-- <a href="#"><span class="fa fa-sticky-note"></span> Blog</a>
          </li>
          <li>
            <a href="#"><span class="fa fa-cogs"></span> Services</a>
          </li> -->
          <li class="nav-item">
            <a href="{% url 'logout' %}"><span class="fa fa-sign-out"></span>Logout</a>
          </li>
        </ul>

        <div class="footer">
        	<p>
					  Copyright &copy;<script>document.write(new Date().getFullYear());</script> All rights reserved | ADBL Digital Banking Department
					</p>
        </div>
    	</nav>

        <!-- Page Content  -->
      <div id="content" class="p-4 p-md-5">

        <nav class="navbar navbar-expand-lg navbar-light bg-light">
          <div class="container-fluid">

            <button type="button" id="sidebarCollapse" class="btn btn-primary">
              <i class="fa fa-bars"></i>
              <span class="sr-only">Toggle Menu</span>
            </button>
            <!-- <button class="btn btn-dark d-inline-block d-lg-none ml-auto" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <i class="fa fa-bars"></i>
            </button> -->

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
              <ul class="nav navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#">Welcome, {{ request.user.username }}</a>
                </li>
              </ul>
            </div>
          </div>
        </nav>
        <div class="card">
          <form method="post" action="{% url 'download_statement' %}" novalidate>
          {% csrf_token %}
          <div class="card-header"><h5 style ="color: rgb(91, 90, 90);">Statement Generator</h5></div>
          <div class="card-body">
            <div class="row">
              <div class="col-md-6">
                <div class="form-group row">
                  <label for="account_number" class="col-sm-4 col-form-label text-right" style="font-weight: lighter">Account Number<span style="color:red">*</span></label>
                  <div class="col-sm-8">
                    <select name="account_number" id="AccountNumberId" class="form-control form-control-sm" required><option value="">-- Please Choose --</option>
                      <option value="12345">12345</option>
                      <option value="123456789">123456789</option></select>
                      <div class="invalid-feedback">
                        Please select an Account Number.
                      </div>      
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group row">
                  <label for="from_date" class="col-sm-4 col-form-label text-right" style="font-weight: lighter">
            From Date<span style="color:red">*</span></label>
                  <div class="col-sm-8">
                    <input type="date" name="from_date" value="from_date" id="from_dateId" placeholder="FromDate" class="form-control form-control-sm" required> 
                    <div class="invalid-feedback">
                      Please select a From Date.
                    </div>       
                  </div>
                </div>
              </div>
             <div class="col-md-6">
                <div class="form-group row">
                  <label for="to_date" class="col-sm-4 col-form-label text-right" style="font-weight: lighter">
            To Date<span style="color:red">*</span></label>
                  <div class="col-sm-8">
                    <input type="date" name="to_date" value="to_date" id="to_dateId" placeholder="ToDate" class="form-control form-control-sm" required>        
                  <div class="invalid-feedback">
                    Please select a To Date.
                  </div>
                  </div>
                </div>
              </div>  
              <div class="col-md-12">
                <div class="form-group row">
                  <label for="DownloadCSV" class="col-sm-2 col-form-label text-right" style="font-weight: lighter"></label>
                  <div class="col-sm-10">
                    <input type="submit" name="DownloadCSV" id="DownloadCSVId" class="btn btn-primary w-30 py-2" value="Download CSV">        
                  </div>
                </div>
              </div>
          </div>
          </div>
          </form>
        </div>
      </div>
		</div>

    <script>
      const form = document.querySelector('form');

      form.addEventListener('submit', e => {

        // Frontend validation
        if (!form.reportValidity()) {
          e.preventDefault();
          form.classList.add('was-validated');
          return; // stop here
        }

        const from = document.getElementById('from_dateId').value;
        const to = document.getElementById('to_dateId').value;
        const today = new Date().toISOString().split('T')[0];

        // From_date > To_date validation
        if (from && to && from > to) {
          e.preventDefault();
          alert("From Date cannot be after To Date.");
          document.getElementById('from_dateId').focus();
          return; // stop here
        }

        // Future date validation
        if ((from && from > today) || (to && to > today)) {
          e.preventDefault();
          alert("Date cannot be in the future.");
          return; // stop here
        }

        // Backend error (ONLY if frontend passed)
        const backendError = "{{ backend_error|default:''|escapejs }}";
        if (backendError) {
          e.preventDefault();
          alert(backendError);
          return;
        }
      });
      </script>


    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'js/popper.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
  </body>
</html>
