{% extends 'statements/base.html' %}

{% block main_body %}
  <div class="card">
    <form method="post" action="{% url 'download_statement' %}" novalidate>
      {% csrf_token %}

      <div class="card-header">
        <h5 style="color: rgb(91, 90, 90);">
          Statement Generator
        </h5>
      </div>

      <div class="card-body">

        <!-- Display backend error -->
        {% if backend_error %}
              <div class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong>Error:</strong> {{ backend_error }}
                <button
                  type="button"
                  class="close"
                  data-dismiss="alert"
                  aria-label="Close"
                >
                  <span aria-hidden="true">&times;</span>
                </button>
              </div>
            {% endif %}

        <div class="row">

          <!-- Account Number -->
          <div class="col-md-6">
            <div class="form-group row">

              <label
                for="AccountNumberId"
                class="col-sm-4 col-form-label text-right"
                style="font-weight: lighter"
              >
                Account Number<span style="color:red">*</span>
              </label>

              <div class="col-sm-8">

                <input
                  type="text"
                  name="account_number"
                  id="AccountNumberId"
                  class="form-control form-control-sm"
                  placeholder="Enter account number"
                  value="{{ account_number|default:'' }}"
                  required
                >

                <div class="invalid-feedback">
                  Please enter an Account Number.
                </div>

              </div>
            </div>
          </div>


          <!-- From Date -->
          <div class="col-md-6">
            <div class="form-group row">

              <label
                for="from_dateId"
                class="col-sm-4 col-form-label text-right"
                style="font-weight: lighter"
              >
                From Date<span style="color:red">*</span>
              </label>

              <div class="col-sm-8">

                <input
                  type="date"
                  name="from_date"
                  id="from_dateId"
                  class="form-control form-control-sm"
                  value="{{ from_date|default:'' }}"
                  required
                >

                <div class="invalid-feedback">
                  Please select a From Date.
                </div>

              </div>
            </div>
          </div>


          <!-- To Date -->
          <div class="col-md-6">
            <div class="form-group row">

              <label
                for="to_dateId"
                class="col-sm-4 col-form-label text-right"
                style="font-weight: lighter"
              >
                To Date<span style="color:red">*</span>
              </label>

              <div class="col-sm-8">

                <input
                  type="date"
                  name="to_date"
                  id="to_dateId"
                  class="form-control form-control-sm"
                  value="{{ to_date|default:'' }}"
                  required
                >

                <div class="invalid-feedback">
                  Please select a To Date.
                </div>

              </div>
            </div>
          </div>


          <!-- Download Button -->
          <div class="col-md-12">
            <div class="form-group row">

              <label
                for="DownloadCSVId"
                class="col-sm-2 col-form-label text-right"
                style="font-weight: lighter"
              >
              </label>

              <div class="col-sm-10">

                <input
                  type="submit"
                  name="DownloadCSV"
                  id="DownloadCSVId"
                  class="btn btn-primary w-30 py-2"
                  value="Download CSV"
                >

              </div>
            </div>
          </div>

        </div>
      </div>
    </form>
  </div>
{% endblock %}
