<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        {% load static %}
        <title>User Login</title>
        <link href="https://fonts.googleapis.com/css?family=Anton%7CBaskervville%7CRaleway&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="{% static 'statements/style.css' %}" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    </head>
    <body>
        <section class="vh-100 d-flex align-items-center justify-content-center">
            <div class="login-gradient-card row g-0 shadow-lg" style="width: 900px; max-width: 95%; min-height: 500px; background: linear-gradient(135deg, #00753b, #2ecc71); border-radius: 16px; overflow: hidden;">

                <!-- Left side (welcome) -->
                <div class="col-lg-6 d-none d-lg-flex flex-column text-center p-5">
                    <div class="flex-grow-1 d-flex align-items-center justify-content-center">
                        <h2 class="text-white fw-bold">Digital Statement API</h2>
                    </div>
                    <p class="text-white mt-3 mb-0">Copyright © 2026. Digital Banking Department</p>
                </div>
                <!-- Right side (login form) -->
                <div class="col-lg-6 bg-white p-5">
                    <form method="POST" action="/login/">
                        {% csrf_token %}
                        <h4 class="mb-4 fw-bold">Login to your account</h4>
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" placeholder="Enter username">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Enter password">
                        </div>

                        <div class="d-flex justify-content-between mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember">
                                <label class="form-check-label" for="remember">Remember me</label>
                            </div>
                            <a href="#" class="text-decoration-none">Forgot password?</a>
                        </div>

                        <button class="btn btn-primary w-100 py-2">Login</button>
                    </form>
                </div>

            </div>
        </section>
    </body>
</html>
